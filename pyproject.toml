[project]
name = "catdog-classifier"
version = "0.1.0"
description = "基于预训练 ResNet18 的猫狗图片二分类项目"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.11.1",
  "pillow==12.3.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
catdog-train = "catdog_classifier.train:main"
catdog-predict = "catdog_classifier.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catdog_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
